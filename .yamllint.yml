---
extends: default

rules:
  document-start:
    present: true
  line-length:
    max: 120
    level: warning
  truthy:
    allowed-values:
      - 'true'
      - 'false'
      - 'on'
      - 'off'
  comments:
    min-spaces-from-content: 1

ignore: |
  node_modules/
  dist/
  coverage/
  storybook-static/
