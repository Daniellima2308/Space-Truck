name: Deploy Supabase Function

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Supabase function to deploy
        required: true
        default: calculate-route
        type: choice
        options:
          - calculate-route
          - calculate-toll
          - send-contact-email

permissions:
  contents: read

concurrency:
  group: deploy-supabase-function-${{ github.event.inputs.function_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.function_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mjkmgnyxiyyuibrmvuqt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase Edge Function
        run: supabase functions deploy "${{ github.event.inputs.function_name }}" --project-ref "$SUPABASE_PROJECT_REF"
