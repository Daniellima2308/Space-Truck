name: Semantic pull request title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  pull-requests: read

concurrency:
  group: semantic-pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semantic-pr:
    name: Validate semantic PR title
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate semantic PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: O título depois do tipo deve começar com letra minúscula. Exemplo: ci: add release automation
          wip: false
